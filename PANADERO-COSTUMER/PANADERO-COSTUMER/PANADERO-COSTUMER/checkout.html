<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PANADERO | Order Checkout</title>
<link href="assets/css/main.css" rel="stylesheet"/>
<link href="assets/css/checkout.css" rel="stylesheet"/>
  <script>window.PANADERO_API="/api";</script>
</head>
<body data-page="">
<div id="site-header"></div>
<main class="page-shell">
<h1 class="page-title">Order Checkout</h1>

<section class="empty-state checkout-empty" hidden="" id="checkout-empty">
<h2>Your cart is empty.</h2>
<p>Add products before continuing to checkout.</p>
<a class="button" href="menu.html" style="margin-top:18px">Browse Menu</a>
</section>
<div class="checkout-layout" hidden="" id="checkout-layout">
<form class="checkout-form" id="checkout-form">
<section class="checkout-section">
<h2>Customer Information</h2>
<div class="form-stack">
<div class="field-row">
<div class="form-group">
<label for="firstName">First Name</label>
<input class="field" id="firstName" name="firstName" required=""/>
</div>
<div class="form-group">
<label for="lastName">Last Name</label>
<input class="field" id="lastName" name="lastName" required=""/>
</div>
</div>
<div class="field-row">
<div class="form-group">
<label for="email">Email</label>
<input class="field" id="email" name="email" required="" type="email"/>
</div>
<div class="form-group">
<label for="mobile">Mobile Number</label>
<input class="field" id="mobile" name="mobile" type="tel"/>
</div>
</div>
</div>
</section>
<section class="checkout-section">
<h2>Fulfillment</h2>
<div class="choice-grid">
<label class="choice">
<input checked="" name="deliveryMethod" type="radio" value="pickup"/>
<span><strong>Pickup</strong></span>
</label>
<label class="choice">
<input name="deliveryMethod" type="radio" value="delivery"/>
<span><strong>Delivery</strong></span>
</label>
</div>
<div hidden id="delivery-address-area" style="margin-top:16px">
<div class="saved-address-section" hidden id="saved-address-section">
<div class="saved-address-heading">
<label for="saved-address-select">Saved Address</label>
<div class="saved-address-actions">
<button class="text-button" id="add-address-button" type="button">+ Add Address</button>
<button class="text-button" id="manage-addresses-button" type="button">Manage</button>
</div>
</div>
<select class="field" id="saved-address-select" aria-label="Saved address"></select>
<div class="saved-address-preview" id="saved-address-preview" hidden></div>
</div>
</div>
</section>
<section class="checkout-section">
<h2>Payment Method</h2>
<div class="choice-grid payment-choice-grid">
<label class="choice">
<input checked="" name="paymentMethod" type="radio" value="cash"/>
<span><strong>Cash</strong></span>
</label>
<label class="choice">
<input name="paymentMethod" type="radio" value="card"/>
<span><strong>Card</strong></span>
</label>
<label class="choice">
<input name="paymentMethod" type="radio" value="gcash"/>
<span><strong>GCash</strong></span>
</label>
</div>
</section>
<p class="status-message" id="checkout-message" role="status"></p>
<button class="button" style="margin-top:20px" type="submit">Submit Order for Processing</button>
</form>
<aside class="checkout-summary">
<h2>Order Summary</h2>
<div class="summary-items" id="checkout-summary-items"></div>
<div class="summary-row total">
<span>Total</span>
<strong id="checkout-subtotal">₱0.00</strong>
</div>

</aside>
</div>
</main>
<dialog class="address-dialog" id="address-dialog" aria-labelledby="address-dialog-title">
<div id="address-dialog-content"></div>
</dialog>
<div id="site-footer"></div>
<script defer="" src="assets/js/products.js"></script>
<script defer="" src="assets/js/product-service.js"></script>
<script defer="" src="assets/js/auth-service.js"></script>
<script defer="" src="assets/js/customer-preferences.js"></script>
<script defer="" src="assets/js/address-service.js"></script>
<script defer="" src="assets/js/ph-address-service.js"></script>
<script defer="" src="assets/js/navigation.js"></script>
<script defer="" src="assets/js/cart.js"></script>
<script defer="" src="assets/js/order-service.js"></script>
<script defer="" src="assets/js/checkout.js"></script>
</body>
</html>
