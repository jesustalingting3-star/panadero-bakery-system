<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PANADERO | Login / Create an Account</title><link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/auth.css"></head><body data-page="login"><div id="site-header"></div><main class="auth-page"><div class="auth-card"><section class="auth-col"><h1>Login</h1><p class="muted">Welcome back, Dreamer!</p><form id="login-form" class="auth-form" novalidate><label class="visually-hidden" for="login-email">Email Address</label><input class="field" id="login-email" name="email" type="email" placeholder="Email Address" autocomplete="email" required><label class="visually-hidden" for="login-password">Password</label><input class="field" id="login-password" name="password" type="password" placeholder="Password" autocomplete="current-password" required><a class="forgot" href="forgot-password.html">Forgot password?</a><button class="button" type="submit">Log In</button><a class="button secondary" href="menu.html">Order as Guest</a><p id="login-message" class="auth-message" role="status"></p></form><p class="legal">By continuing, you agree to our <a href="terms.html">Terms and Conditions</a> and <a href="privacy.html">Privacy Policy</a>.</p></section><section class="auth-col"><h2>Sign Up</h2><p class="muted">Create an Account</p><form id="register-form" class="auth-form" novalidate><div class="field-row"><input class="field" name="first_name" placeholder="First Name" autocomplete="given-name" required><input class="field" name="last_name" placeholder="Last Name" autocomplete="family-name" required></div><div class="field-row"><input class="field" name="email" type="email" placeholder="Email Address" autocomplete="email" required><input class="field" name="mobile" type="tel" placeholder="Mobile No." autocomplete="tel"></div><div class="field-row"><input class="field" id="reg-password" name="password" type="password" placeholder="Password" autocomplete="new-password" required><input class="field" id="confirm-password" name="confirm_password" type="password" placeholder="Confirm Password" autocomplete="new-password" required></div><div class="checks"><label class="check"><input type="checkbox" name="terms" required><span>I agree to the <a href="terms.html">Terms and Conditions</a> and <a href="privacy.html">Privacy Policy</a>.</span></label><label class="check"><input type="checkbox" name="promos"><span>I want to receive promos and discounts on my email.</span></label></div><p id="register-message" class="auth-message" role="status"></p><button class="button" type="submit">Create Account</button></form></section></div></main><div id="site-footer"></div><script>window.PANADERO_API="/api";</script>

<script src="assets/js/product-service.js" defer></script>
<script src="assets/js/auth-service.js" defer></script>

<script src="assets/js/cart.js" defer></script>
