<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANADERO | Login</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
  <script>window.PANADERO_API="/api";</script>
</head>
<body data-page="login">
    <div id="site-header"></div>

    <main class="auth-page">
        <div class="auth-card auth-card-single">
            <section class="auth-col">
                <h1>Login</h1>

                <form id="login-form" class="auth-form" novalidate>
                    <label class="visually-hidden" for="login-email">Email Address</label>
                    <input class="field" id="login-email" name="email" type="email" placeholder="Email Address" autocomplete="email" required>

                    <label class="visually-hidden" for="login-password">Password</label>
                    <input class="field" id="login-password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>

                    <a class="forgot" href="forgot-password.html">Forgot password?</a>
                    <button class="button" type="submit">Log In</button>
                    <p id="login-message" class="auth-message" role="status"></p>
                </form>

                <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
                <p class="legal">By continuing, you agree to our <a href="terms.html">Terms and Conditions</a> and <a href="privacy.html">Privacy Policy</a>.</p>
            </section>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="assets/js/products.js" defer></script>
    <script src="assets/js/product-service.js" defer></script>
    <script src="assets/js/auth-service.js" defer></script>
    <script src="assets/js/navigation.js" defer></script>
    <script src="assets/js/cart.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
</body>
</html>
