<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PANADERO | Place Reservation</title>
<link href="assets/css/main.css" rel="stylesheet"/>
<link href="assets/css/checkout.css" rel="stylesheet"/>
  <script>window.PANADERO_API="/api";</script>
</head>
<body data-page="">
<div id="site-header"></div>
<main class="page-shell">
<h1 class="page-title">Place Reservation</h1>

<section class="empty-state checkout-empty" hidden="" id="reservation-empty">
<h2>Reservation item unavailable.</h2>
<p>Please choose a product from the menu before making a reservation.</p>
<a class="button" href="menu.html" style="margin-top:18px">Browse Menu</a>
</section>
<div class="checkout-layout" hidden="" id="reservation-layout">
<form class="checkout-form" id="reservation-form">
<section class="checkout-section">
<h2>Customer Information</h2>
<div class="form-stack">
<div class="field-row">
<div class="form-group">
<label for="firstName">First Name</label>
<input class="field" id="firstName" name="firstName" required=""/>
</div>
<div class="form-group">
<label for="lastName">Last Name</label>
<input class="field" id="lastName" name="lastName" required=""/>
</div>
</div>
<div class="field-row">
<div class="form-group">
<label for="email">Email</label>
<input class="field" id="email" name="email" required="" type="email"/>
</div>
<div class="form-group">
<label for="mobile">Mobile Number</label>
<input class="field" id="mobile" name="mobile" type="tel"/>
</div>
</div>
</div>
</section>
<section class="checkout-section">
<h2>Reservation Schedule</h2>
<div class="field-row">
<div class="form-group">
<label for="date">Preferred Date</label>
<input class="field" id="date" name="date" required="" type="date"/>
</div>
<div class="form-group">
<label for="time">Preferred Time</label>
<input class="field" id="time" name="time" required="" type="time"/>
</div>
</div>
</section>
<p class="status-message" id="reservation-message" role="status"></p>
<button class="button reservation-button" style="margin-top:20px" type="submit">Submit Reservation Request</button>
</form>
<aside class="checkout-summary">
<h2>Reservation Summary</h2>
<div class="summary-items" id="reservation-summary-items"></div>
<div class="summary-row total">
<span>Total</span>
<strong id="reservation-subtotal">₱0.00</strong>
</div>

</aside>
</div>
</main>
<div id="site-footer"></div>
<script defer="" src="assets/js/products.js"></script>
<script defer="" src="assets/js/product-service.js"></script>
<script defer="" src="assets/js/auth-service.js"></script>
<script defer="" src="assets/js/customer-preferences.js"></script>
<script defer="" src="assets/js/navigation.js"></script>
<script defer="" src="assets/js/cart.js"></script>
<script defer="" src="assets/js/reservation-service.js"></script>
<script defer="" src="assets/js/reservation.js"></script>
</body>
</html>
