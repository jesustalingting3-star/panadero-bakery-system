<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANADERO | Staff Inventory & Batches</title>
    <link rel="stylesheet" href="assets/css/staff.css">
</head>
<body class="staff-body" data-staff-page="inventory">
    <div id="staff-shell"></div>

    <template id="staff-page-content">
        <header class="staff-page-heading">
            <div>
                <h1>Inventory &amp; Fresh Batches</h1>
            </div>
            <button class="staff-primary" id="open-batch-dialog" type="button">+ Add Fresh Batch</button>
        </header>

        <section class="staff-panel">
            <div class="staff-panel-header">
                <div>
                    <h2>Product Inventory</h2>
                </div>
            </div>
            <div class="staff-panel-body">
                <div class="staff-toolbar">
                    <input class="staff-field" id="inventory-search" type="search" placeholder="Search a product..." autocomplete="off" aria-label="Search inventory">
                    <select class="staff-field" id="inventory-category" aria-label="Filter category">
                        <option value="all">All Categories</option>
                    </select>
                    <select class="staff-field" id="inventory-status" aria-label="Filter availability">
                        <option value="all">All Availability</option>
                        <option value="in-stock">In Stock</option>
                        <option value="out-of-stock">Out of Stock</option>
                        <option value="not-set">Stock Not Set</option>
                    </select>
                </div>

                <div class="staff-table-wrap">
                    <table class="staff-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Availability</th>
                                <th>Stock Quantity</th>
                                <th>Last Updated</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table"></tbody>
                    </table>
                    <p class="staff-empty" id="inventory-empty" role="status" hidden></p>
                </div>
                <p class="staff-message" id="inventory-message" role="status"></p>
            </div>
        </section>

        <section class="staff-panel">
            <div class="staff-panel-header">
                <div>
                    <h2>Recent Baking Batches</h2>
                </div>
            </div>
            <div class="staff-panel-body">
                <div class="batch-list" id="batch-list"></div>
                <p class="staff-empty" id="batch-empty" role="status" hidden></p>
            </div>
        </section>

        <dialog class="staff-dialog" id="batch-dialog" aria-labelledby="batch-title">
            <div class="staff-dialog-header">
                <div>
                    <h2 id="batch-title">Add Fresh Batch</h2>
                </div>
                <button class="dialog-close" id="close-batch-dialog" type="button" aria-label="Close">×</button>
            </div>
            <form id="batch-form">
                <div class="staff-form-grid">
                    <div class="staff-form-group full">
                        <label for="batch-product">Product</label>
                        <select class="staff-field" id="batch-product" name="productId" required></select>
                    </div>
                    <div class="staff-form-group">
                        <label for="batch-quantity">Quantity Baked</label>
                        <input class="staff-field" id="batch-quantity" name="quantity" type="number" min="1" step="1" required>
                    </div>
                    <div class="staff-form-group">
                        <label for="batch-baked-date">Baked Date</label>
                        <input class="staff-field" id="batch-baked-date" name="bakedDate" type="date" required>
                    </div>
                    <div class="staff-form-group">
                        <label for="batch-expiration-date">Expiration Date</label>
                        <input class="staff-field" id="batch-expiration-date" name="expirationDate" type="date" required>
                    </div>
                    <div class="staff-form-group full">
                        <label for="batch-notes">Notes (Optional)</label>
                        <textarea class="staff-field" id="batch-notes" name="notes" maxlength="500" rows="3"></textarea>
                    </div>
                    <p class="staff-message full" id="batch-message" role="status"></p>
                    <div class="staff-form-actions">
                        <button class="staff-secondary" id="cancel-batch" type="button">Cancel</button>
                        <button class="staff-primary" type="submit">Save Batch</button>
                    </div>
                </div>
            </form>
        </dialog>
    </template>

    <script src="assets/js/products.js"></script>
    <script src="assets/js/staff-data.js"></script>
    <script src="assets/js/staff-shell.js"></script>
    <script src="assets/js/staff-inventory.js"></script>
</body>
</html>
