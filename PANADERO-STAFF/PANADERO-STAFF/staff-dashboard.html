<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANADERO | Staff Dashboard</title>
    <link rel="stylesheet" href="assets/css/staff.css">
</head>
<body class="staff-body" data-staff-page="dashboard">
    <div id="staff-shell"></div>

    <template id="staff-page-content">
        <header class="staff-page-heading">
            <div>
                <h1>Dashboard</h1>
            </div>
        </header>

        <section class="metric-grid" aria-label="Bakery overview">
            <article class="metric-card">
                <span>Total Recorded Stock</span>
                <strong id="metric-stock"></strong>
            </article>
            <article class="metric-card">
                <span>Pending Requests</span>
                <strong id="metric-pending"></strong>
            </article>
            <article class="metric-card">
                <span>Ready for Release</span>
                <strong id="metric-ready"></strong>
            </article>
            <article class="metric-card">
                <span>Inventory Needs Attention</span>
                <strong id="metric-attention"></strong>
            </article>
        </section>

        <section class="staff-panel">
            <div class="staff-panel-header">
                <div>
                    <h2>Recent Orders &amp; Reservations</h2>
                </div>
                <a class="staff-secondary" href="staff-orders.html">View All</a>
            </div>
            <div class="staff-table-wrap">
                <table class="staff-table">
                    <thead>
                        <tr>
                            <th>Reference</th>
                            <th>Type</th>
                            <th>Customer</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Submitted</th>
                        </tr>
                    </thead>
                    <tbody id="dashboard-records"></tbody>
                </table>
                <p class="staff-empty" id="dashboard-empty" role="status" hidden></p>
            </div>
        </section>
    </template>

    <script>window.PANADERO_API="/api";</script>
    <script src="assets/js/portal-guard.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/staff-data.js"></script>
    <script src="assets/js/staff-shell.js"></script>
    <script src="assets/js/staff-dashboard.js"></script>
</body>
</html>
